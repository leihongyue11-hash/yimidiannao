<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>壹米说电脑</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f0f4f8;
      color: #1e293b;
      overflow-x: hidden;
    }

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: -1;
      background: linear-gradient(135deg, #dbeafe 0%, #fef3c7 50%, #dbeafe 100%);
    }

    header {
      text-align: center;
      padding: 40px 20px;
      color: #1e293b;
    }

    header img.logo {
      width: 120px;
      height: auto;
      margin-bottom: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
      letter-spacing: 2px;
      color: #2563eb;
    }

    header p {
      margin-top: 8px;
      font-size: 18px;
      color: #475569;
    }

    .container {
      width: 92%;
      max-width: 1000px;
      margin: 20px auto;
    }

    .section {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(6px);
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 35px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.06);
    }

    .section h2 {
      margin-top: 0;
      border-left: 5px solid #f97316;
      padding-left: 10px;
      font-size: 22px;
      color: #1e293b;
    }

    .skills, .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(37, 99, 235, 0.05);
      padding: 20px;
      border-radius: 10px;
      transition: 0.2s;
      border: 1px solid rgba(0,0,0,0.06);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.15);
      background: rgba(37, 99, 235, 0.1);
    }

    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      color: #f97316;
    }

    .qrcode-box {
      text-align: center;
      margin-top: 25px;
    }

    .qrcode-box img {
      width: 180px;
      height: 180px;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #475569;
      margin-top: 40px;
      font-size: 14px;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

</head>

<body>

  <div id="particles-js"></div>

  <header>
    <img src="images/logo.png" class="logo" alt="壹米说电脑 Logo" />
    <h1>壹米说电脑</h1>
    <p>专注电脑硬件·系统技巧·维修经验分享</p>
  </header>

  <div class="container">

    <div class="section">
      <h2>个人简介</h2>
      <p>从事电脑维修行业多年，坚持分享真实实用的电脑知识与技巧。</p>
    </div>

    <div class="section">
      <h2>技能特长</h2>

      <div class="skills">
        <div class="card">电脑维修</div>
        <div class="card">维修故事案例</div>
        <div class="card">硬件评测</div>
        <div class="card">
          <h3>壹米说电脑工具箱</h3>
          <p>电脑维修检测、各种常用软件、定制工具箱</p>
          <a href="https://pan.baidu.com/s/1rs0AVBK9UjF9YFB-yZfFww?pwd=zhxc" target="_blank" rel="noopener noreferrer">网盘下载</a>
        </div>
        <div class="card">
          <h3>软件技巧分享</h3>
          <p>壹米说电脑分享的软件合集</p>
          <a href="https://pan.baidu.com/s/5K19zjFNfDDXftIR3TrgSlA" target="_blank" rel="noopener noreferrer">知识库</a>
        </div>
        <div class="card">系统重装与优化</div>
        <a href="https://leihongyue11-hash.github.io/yimidiannao11/">佛系修电脑</a>
      </div>

    </div>

    <div class="section">
      <h2>精选项目</h2>

      <div class="projects">

        <div class="card">
          <h3>公众号</h3>
          <p>提供最新的维修技巧与硬件知识。</p>
          <a href="https://mp.weixin.qq.com/s/havu_WZ8Miv27NmwWuRsOw" target="_blank" rel="noopener noreferrer">查看文章</a>
        </div>

        <div class="card">
          <h3>电脑维修服务</h3>
          <p>线上/线下全方位电脑维修服务</p>
          <p>1039696919@qq.com</p>
        </div>

      </div>
    </div>

    <!-- 二维码区域 -->
    <div class="section qrcode-box">
      <h2>关注「壹米说电脑」公众号</h2>
      <img src="images/qrcode.jpg" alt="公众号二维码" />
      <p style="margin-top: 10px;">获取更多电脑技巧与实用工具</p>
    </div>

  </div>

  <div class="footer">? 2025 壹米说电脑</div>

  <script>
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 80 },
        "size": { "value": 3 },
        "color": { "value": ["#2563eb", "#f97316"] },
        "line_linked": {
          "enable": true,
          "color": "#2563eb",
          "opacity": 0.3
        },
        "move": { "speed": 2 }
      }
    });
  </script>

</body>
</html>
